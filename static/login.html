<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiskLens Admin Sign-in</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center px-4">
<main class="w-full max-w-sm bg-white rounded-xl shadow-sm p-6 flex flex-col gap-4">
<div class="flex flex-col gap-1">
<h1 class="text-xl font-semibold">Admin sign-in</h1>
<p class="text-sm text-slate-500">Uploads, saved holdings and OCR need the admin password.</p>
</div>
<form id="loginForm" class="flex flex-col gap-3">
<label class="flex flex-col gap-1 text-sm">
<span class="font-medium">Password</span>
<input id="password" type="password" autocomplete="current-password" required
  class="border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"/>
</label>
<p id="loginError" class="text-sm text-red-600 min-h-[1.25rem]" role="alert"></p>
<button id="loginButton" type="submit"
  class="w-full rounded-lg bg-sky-500 text-white font-medium py-2 hover:bg-sky-600 disabled:opacity-60">
Sign in
</button>
</form>
</main>
<script>
  (function () {
    var form = document.getElementById("loginForm");
    var errorLine = document.getElementById("loginError");
    var button = document.getElementById("loginButton");

    // Only send the user to a path on this site, never to another address.
    function nextPath() {
      var next = new URLSearchParams(window.location.search).get("next") || "";
      return next.charAt(0) === "/" && next.charAt(1) !== "/" ? next : "/admin";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorLine.textContent = "";
      button.disabled = true;
      try {
        var res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (res.ok) {
          window.location.href = nextPath();
          return;
        }
        var data = await res.json().catch(function () { return {}; });
        errorLine.textContent = typeof data.detail === "string" ? data.detail : "Sign-in failed.";
      } catch (e) {
        errorLine.textContent = "Could not reach the server.";
      } finally {
        button.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
